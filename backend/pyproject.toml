[project]
name = "parking-simulator-backend"
version = "0.1.0"
description = "Backend simulator and API for the Codex ParkingSimulator implementation."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "gymnasium>=1.0.0",
  "numpy>=2.0.0",
  "pydantic>=2.8.0",
  "stable-baselines3>=2.4.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gymnasium.*", "numpy.*", "stable_baselines3.*"]
ignore_missing_imports = true
